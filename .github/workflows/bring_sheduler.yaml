name: Run Bring Script

on:
  schedule:
    # This runs at 8 AM UTC every day
    # Use crontab.guru to customize: https://crontab.guru/
    - cron: '*/5 * * * *'
  
  # Optional: Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run script
      env:
        BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
        BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
        LIST_UUID: ${{ secrets.LIST_UUID }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: python main.py
